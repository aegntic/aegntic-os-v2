<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc"><title id="title">Recorded verification chart</title><desc id="desc">Combined app and launch suite: 21 tests, 252 assertions; 19 workspace tests and 2 launch tests. Separate Cloudroom qualification has one unresolved failure.</desc><rect width="1200" height="440" rx="18" fill="#f0f3f1"/><g font-family="system-ui, sans-serif"><text x="40" y="47" fill="#5f737c" font-size="15" font-weight="650">RECORDED VERIFICATION / 16 OCTOBER 2026</text><text x="40" y="122" fill="#20313b" font-size="60" font-weight="650">21</text><text x="40" y="157" fill="#5f737c" font-size="16">combined app + launch tests</text><text x="430" y="122" fill="#20313b" font-size="60" font-weight="650">252</text><text x="430" y="157" fill="#5f737c" font-size="16">recorded assertions</text><text x="820" y="122" fill="#20313b" font-size="60" font-weight="650">1</text><text x="820" y="157" fill="#5f737c" font-size="16">unresolved upstream test issue</text><text x="40" y="215" fill="#20313b" font-size="18" font-weight="650">Application-suite composition</text><rect x="40" y="240" width="1013" height="30" rx="4" fill="#286b7e"/><rect x="1053" y="240" width="107" height="30" rx="4" fill="#90b4bf"/><text x="40" y="306" fill="#286b7e" font-size="16" font-weight="650">19 workspace tests</text><text x="820" y="306" fill="#5f737c" font-size="16" font-weight="650">2 launch-site tests</text><text x="40" y="363" fill="#5f737c" font-size="16">Cloudroom qualification is separate: 40 passed / 1 failed. Its application adapter is not connected.</text><text x="40" y="402" fill="#5f737c" font-size="14">Retained evidence, not a new test run, throughput benchmark or claim of production readiness.</text></g></svg>