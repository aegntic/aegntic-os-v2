<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="385" viewBox="0 0 1200 385" role="img" aria-labelledby="title desc"><title id="title">Five Aegntic outcome workspaces</title><desc id="desc">Venture Lab, Product Foundry, Experience Studio, Knowledge Engine and Agent Evolution share an evidence-led workflow.</desc><rect width="1200" height="385" rx="18" fill="#f0f3f1"/><g font-family="system-ui, sans-serif"><text x="40" y="47" fill="#5f737c" font-size="15" font-weight="650">FIVE OUTCOMES / START WITH THE RESULT</text><rect x="40" y="85" width="210" height="210" rx="10" fill="#fff" stroke="#b9c9ce"/><text x="58" y="124" fill="#286b7e" font-size="24">01</text><text x="58" y="171" fill="#20313b" font-size="17" font-weight="650">Venture Lab</text><text x="58" y="211" fill="#5f737c" font-size="13">Audience + offer</text><text x="58" y="258" fill="#5f737c" font-size="13">Test what matters.</text><rect x="270" y="85" width="210" height="210" rx="10" fill="#fff" stroke="#b9c9ce"/><text x="288" y="124" fill="#286b7e" font-size="24">02</text><text x="288" y="171" fill="#20313b" font-size="17" font-weight="650">Product Foundry</text><text x="288" y="211" fill="#5f737c" font-size="13">Working software</text><text x="288" y="258" fill="#5f737c" font-size="13">Build a useful slice.</text><rect x="500" y="85" width="210" height="210" rx="10" fill="#fff" stroke="#b9c9ce"/><text x="518" y="124" fill="#286b7e" font-size="24">03</text><text x="518" y="171" fill="#20313b" font-size="17" font-weight="650">Experience Studio</text><text x="518" y="211" fill="#5f737c" font-size="13">Design + interaction</text><text x="518" y="258" fill="#5f737c" font-size="13">Give it a clear form.</text><rect x="730" y="85" width="210" height="210" rx="10" fill="#fff" stroke="#b9c9ce"/><text x="748" y="124" fill="#286b7e" font-size="24">04</text><text x="748" y="171" fill="#20313b" font-size="17" font-weight="650">Knowledge Engine</text><text x="748" y="211" fill="#5f737c" font-size="13">Sourced decisions</text><text x="748" y="258" fill="#5f737c" font-size="13">Keep the provenance.</text><rect x="960" y="85" width="210" height="210" rx="10" fill="#fff" stroke="#b9c9ce"/><text x="978" y="124" fill="#286b7e" font-size="24">05</text><text x="978" y="171" fill="#20313b" font-size="17" font-weight="650">Agent Evolution</text><text x="978" y="211" fill="#5f737c" font-size="13">Controlled improvement</text><text x="978" y="258" fill="#5f737c" font-size="13">Measure the change.</text><text x="40" y="344" fill="#5f737c" font-size="18">One workflow: intent → direction → launch kit → execution → evidence → review.</text></g></svg>