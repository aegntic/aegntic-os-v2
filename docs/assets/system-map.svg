<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Aegntic architecture map</title><desc id="desc">People approve the creative brief; Bun tracks application records; Pi Durable and Codex execute locally. Convex is planned. Evidence returns to six-control review.</desc><rect width="1200" height="520" rx="18" fill="#f0f3f1"/><g font-family="system-ui, sans-serif"><text x="40" y="47" fill="#5f737c" font-size="15" font-weight="650">THE SYSTEM / ONE EXECUTION AUTHORITY</text><rect x="40" y="85" width="330" height="110" rx="10" fill="#ffffff" stroke="#b9c9ce"/><text x="60" y="120" fill="#20313b" font-size="19" font-weight="650">People + creative direction</text><text x="60" y="149" fill="#5f737c" font-size="13">Brief / reviewed launch package</text><rect x="430" y="85" width="330" height="110" rx="10" fill="#ffffff" stroke="#b9c9ce"/><text x="450" y="120" fill="#20313b" font-size="19" font-weight="650">Bun outcome workspace</text><text x="450" y="149" fill="#5f737c" font-size="13">Local briefs / approvals / run references</text><rect x="820" y="85" width="340" height="110" rx="10" fill="#dce9eb" stroke="#b9c9ce"/><text x="840" y="120" fill="#20313b" font-size="19" font-weight="650">Pi Durable + Codex</text><text x="840" y="149" fill="#5f737c" font-size="13">CONNECTED LOCALLY / recovery + tools</text><path d="M370 140 H418" stroke="#286b7e" stroke-width="2"/><path d="M410 134 l8 6 -8 6" fill="none" stroke="#286b7e" stroke-width="2"/><path d="M760 140 H808" stroke="#286b7e" stroke-width="2"/><path d="M800 134 l8 6 -8 6" fill="none" stroke="#286b7e" stroke-width="2"/><rect x="430" y="255" width="330" height="100" rx="10" fill="#ffffff" stroke="#b9c9ce"/><text x="450" y="290" fill="#20313b" font-size="19" font-weight="650">Files + execution evidence</text><text x="450" y="319" fill="#5f737c" font-size="13">Inspect results / reconnect / stop</text><path d="M990 195 V230 H595 V255" fill="none" stroke="#286b7e" stroke-width="2"/><rect x="40" y="255" width="330" height="100" rx="10" fill="#ffffff" stroke="#b9c9ce"/><text x="60" y="290" fill="#20313b" font-size="19" font-weight="650">Six-control release review</text><text x="60" y="319" fill="#5f737c" font-size="13">Operator evidence / separate release</text><path d="M430 305 H382" stroke="#286b7e" stroke-width="2"/><rect x="820" y="255" width="340" height="100" rx="10" fill="#e8edec" stroke="#b9c9ce"/><text x="840" y="290" fill="#20313b" font-size="19" font-weight="650">Convex shared records</text><text x="840" y="319" fill="#5f737c" font-size="13">PLANNED / not a second scheduler</text><path d="M760 305 H820" stroke="#5f737c" stroke-width="2" stroke-dasharray="6 5"/><text x="40" y="415" fill="#286b7e" font-size="13" font-weight="650">SOLID = LOCAL IMPLEMENTATION</text><text x="430" y="415" fill="#5f737c" font-size="13" font-weight="650">DASHED = PLANNED CONNECTION</text><text x="40" y="466" fill="#5f737c" font-size="17">Assembly launch site is a separate local service. Publishing and distribution remain planned.</text></g></svg>