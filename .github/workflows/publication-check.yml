name: Public source boundary
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  public-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check tracked files and history
        run: |
          python3 scripts/check_publication.py --mode index
          python3 scripts/check_publication.py --mode history
      - name: Test publication boundaries
        run: python3 -m unittest discover -s tests -p 'test_publication.py' -v
